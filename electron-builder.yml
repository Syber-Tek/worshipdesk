appId: com.sybertek.worddesk
productName: WordDesk
directories:
  buildResources: build
  output: release
files:
  - "out/**/*"
  - "package.json"
  - "src/assets/app-icon-dark.png"
  - "src/assets/app-icon-light.png"
  - "bibles/**/*"
  - "hymns/**/*"
asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

# better-sqlite3 13 is a pure node-addon-api (N-API) module and ships its own
# win32-x64 prebuild in prebuilds/. N-API is ABI-stable, so recompiling it per
# Electron version produces the same thing - except that node-gyp then demands a
# full Visual Studio C++ toolchain just to package the app. Turning the rebuild
# off lets `npm run make` work on a clean checkout.
npmRebuild: false

# Auto-update feed. The source repo is private, so updates are served from the
# public worddesk-releases repo, which the release workflow publishes to.
# electron-updater bakes this into app-update.yml inside the packaged app, and
# electron-builder writes the matching latest.yml / latest-mac.yml metadata next
# to the installers.
publish:
  provider: github
  owner: Syber-Tek
  repo: worddesk-releases
  releaseType: release

electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  executableName: worddesk
  icon: src/assets/app-icon-dark.ico
  target:
    - nsis

nsis:
  # Re-running the setup file on a machine that already has WordDesk offers
  # repair/update or uninstall instead of silently reinstalling over the top.
  # electron-builder finds build/installer.nsh on its own; naming it here makes
  # the dependency explicit.
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WordDesk
  uninstallDisplayName: WordDesk
  installerIcon: src/assets/app-icon-dark.ico
  uninstallerIcon: src/assets/app-icon-dark.ico
  installerHeaderIcon: src/assets/app-icon-dark.ico
  # No spaces on purpose. For the GitHub provider electron-builder rewrites the
  # download URL in latest.yml to a "GitHub safe" name (spaces become dashes),
  # so a name containing spaces would publish an installer that auto-update
  # cannot find. Keeping it space-free makes the asset name and the URL match.
  artifactName: ${productName}-Setup-${version}.${ext}

mac:
  icon: src/assets/app-icon-dark.png
  category: public.app-category.productivity
  identity: null
  # electron-builder normally omits ${arch} for the platform's default
  # architecture, which makes the Intel and Apple Silicon DMGs share the name
  # WorshipDesk-<version>.dmg. Forcing an explicit pattern keeps -x64 and
  # -arm64 in the filename so both can be published side by side.
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - dmg
    - zip

linux:
  executableName: worddesk
  category: Utility
  maintainer: dellpc788@gmail.com
  icon: src/assets/app-icon-dark.png
  target:
    - AppImage
    - deb
    - rpm