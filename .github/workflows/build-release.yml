name: Build and Release WorshipDesk Cross-Platform Executables

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfakeroot rpm dpkg build-essential

      - name: Install Dependencies
        run: npm ci

      - name: Generate macOS ICNS Icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          source="src/assets/app-icon-dark.png"
          iconset="src/assets/app-icon-dark.iconset"
          output="src/assets/app-icon-dark.icns"

          test -f "$source"
          rm -rf "$iconset" "$output"
          mkdir -p "$iconset"

          sips -z 16 16 "$source" \
            --out "$iconset/icon_16x16.png"
          sips -z 32 32 "$source" \
            --out "$iconset/icon_16x16@2x.png"

          sips -z 32 32 "$source" \
            --out "$iconset/icon_32x32.png"
          sips -z 64 64 "$source" \
            --out "$iconset/icon_32x32@2x.png"

          sips -z 128 128 "$source" \
            --out "$iconset/icon_128x128.png"
          sips -z 256 256 "$source" \
            --out "$iconset/icon_128x128@2x.png"

          sips -z 256 256 "$source" \
            --out "$iconset/icon_256x256.png"
          sips -z 512 512 "$source" \
            --out "$iconset/icon_256x256@2x.png"

          sips -z 512 512 "$source" \
            --out "$iconset/icon_512x512.png"
          sips -z 1024 1024 "$source" \
            --out "$iconset/icon_512x512@2x.png"

          iconutil --convert icns "$iconset" --output "$output"
          test -s "$output"

      - name: Build, Package and Create Executables
        run: npm run make

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worshipdesk-${{ matrix.os }}
          path: |
            out/make/**/*.exe
            out/make/**/*.dmg
            out/make/**/*.zip
            out/make/**/*.deb
            out/make/**/*.rpm
            out/make/**/*.AppImage
          if-no-files-found: warn

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || (github.ref_type == 'tag' && github.ref_name || 'v1.0.0') }}
          files: artifacts/**/*
          name: WorshipDesk Release ${{ github.event.inputs.tag_name || (github.ref_type == 'tag' && github.ref_name || 'v1.0.0') }}
          body: |
            ## 🚀 WorshipDesk Cross-Platform Release

            Download standalone app archives & offline setup installers:
            - 🪟 **Windows**: `.exe Setup Installer` & `WorshipDesk-win32-x64.zip`
            - 🍎 **macOS**: `.dmg Installer` & `WorshipDesk-darwin-*.zip`
            - 🐧 **Linux**: `.deb`, `.rpm`, `.AppImage` & `WorshipDesk-linux-x64.zip`
          draft: false
          prerelease: false
          overwrite: true