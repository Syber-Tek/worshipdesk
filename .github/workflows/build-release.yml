name: Build and Release WorshipDesk Cross-Platform Executables

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js Environment
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfakeroot rpm dpkg build-essential

      - name: Install Dependencies
        run: npm ci

      - name: Build, Package and Create Executables
        run: npm run make

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worshipdesk-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.deb
          if-no-files-found: warn

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or Update GitHub Release in Public Repo
        uses: softprops/action-gh-release@v2
        with:
          repository: Syber-Tek/worshipdesk-releases
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          tag_name: ${{ github.event.inputs.tag_name || (github.ref_type == 'tag' && github.ref_name || 'v1.0.0') }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
          name: WorshipDesk Release ${{ github.event.inputs.tag_name || (github.ref_type == 'tag' && github.ref_name || 'v1.0.0') }}
          body: |
            ## 🚀 WorshipDesk Official Release

            Download standalone offline setup installers:
            - 🪟 **Windows**: `.exe` Installer
            - 🍎 **macOS**: `.dmg` Disk Image
            - 🐧 **Linux**: `.deb` Debian Package
          draft: false
          prerelease: false
          overwrite: true