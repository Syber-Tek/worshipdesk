name: Build and Release WorshipDesk Cross-Platform Executables

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfakeroot rpm dpkg

      - name: Install Dependencies
        run: npm ci

      - name: Build, Package and Create Executables
        run: npm run make

      - name: Create Release Zip Archives
        shell: pwsh
        run: |
          Get-ChildItem out -Directory | ForEach-Object {
            $dirName = $_.Name
            $zipPath = "out/WorshipDesk-$dirName.zip"
            Compress-Archive -Path "$($_.FullName)/*" -DestinationPath $zipPath -Force
          }

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name || 'v1.0.0') }}
          files: |
            out/WorshipDesk-*.zip
            out/make/**/*.exe
            out/make/**/*.dmg
            out/make/**/*.zip
            out/make/**/*.deb
            out/make/**/*.rpm
            out/make/**/*.AppImage
          name: WorshipDesk Release ${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name || 'v1.0.0') }}
          body: |
            ## 🚀 WorshipDesk Cross-Platform Release
            
            Download standalone app archives & offline setup installers:
            - 🪟 **Windows**: `.exe Setup Installer` & `WorshipDesk-win32-x64.zip`
            - 🍎 **macOS**: `.dmg Installer` & `WorshipDesk-darwin-*.zip`
            - 🐧 **Linux**: `.deb`, `.rpm`, `.AppImage` & `WorshipDesk-linux-x64.zip`
          draft: false
          prerelease: false
