name: Build and Release WorshipDesk Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build, Package and Create Windows Installer
        run: npm run make

      - name: Zip Packaged Application Folder
        run: |
          $pkg = Get-ChildItem out -Directory | Where-Object { $_.Name -like '*-win32-x64' } | Select-Object -First 1
          Compress-Archive -Path "$($pkg.FullName)/*" -DestinationPath out/WorshipDesk-Windows-x64.zip -Force

      - name: Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            out/WorshipDesk-Windows-x64.zip
            out/make/squirrel.windows/x64/*.exe
          name: WorshipDesk Release ${{ github.ref_name }}
          body: |
            ## 🚀 WorshipDesk Desktop Release
            
            Download offline Windows installer or standalone zip archive:
            - **`WorshipDesk-Windows-x64.zip`**: Portable standalone application archive.
            - **`.exe Setup Installer`**: Automatic Windows installer.
          draft: false
          prerelease: false
