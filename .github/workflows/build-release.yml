name: Build and Release WorshipDesk Cross-Platform Executables

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: Windows x64
            builder_args: --win --x64
          # Apple Silicon. macos-latest is an arm64 runner.
          - os: macos-latest
            name: macOS Apple Silicon (arm64)
            builder_args: --mac --arm64
          # Intel. macos-latest alone produced an arm64-only app, which macOS
          # refuses to open on an Intel Mac ("not supported on this Mac").
          - os: macos-15-intel
            name: macOS Intel (x64)
            builder_args: --mac --x64
          - os: ubuntu-latest
            name: Linux x64
            builder_args: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js Environment
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfakeroot rpm dpkg build-essential

      - name: Install Dependencies
        run: npm ci

      # Build and package are separate so the architecture flags reach
      # electron-builder rather than being appended to electron-vite build.
      - name: Build Sources
        run: npm run build

      - name: Package and Create Executables
        run: npx electron-builder --publish never ${{ matrix.builder_args }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worshipdesk-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            # Needed by the release job so it can publish the auto-update
            # metadata for electron-updater.
            release/*.yml
            release/*.blockmap
          if-no-files-found: warn

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or Update GitHub Release in Public Repo
        uses: softprops/action-gh-release@v2
        with:
          repository: Syber-Tek/worshipdesk-releases
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          tag_name: ${{ github.event.inputs.tag_name || (github.ref_type == 'tag' && github.ref_name || 'v1.0.0') }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            # Auto-update metadata. Without latest.yml / latest-mac.yml alongside
            # the installers, electron-updater can see a release but has nothing
            # to compare versions or download against.
            artifacts/**/*.yml
            artifacts/**/*.blockmap
          name: WorshipDesk Release ${{ github.event.inputs.tag_name || (github.ref_type == 'tag' && github.ref_name || 'v1.0.0') }}
          body: |
            ## 🚀 WorshipDesk Official Release

            Download standalone offline setup installers:
            - 🪟 **Windows**: `.exe` Installer
            - 🍎 **macOS Apple Silicon** (M1/M2/M3/M4): `.dmg` ending in `-arm64.dmg`
            - 🍎 **macOS Intel** (older Macs): `.dmg` ending in `-x64.dmg`
            - 🐧 **Linux**: `.AppImage` Universal Package (Supports all Linux distros)

            > **Not sure which macOS build to download?**
            > Click the  (Apple menu) → **About This Mac**.
            > "Apple M1/M2/M3/M4" means Apple Silicon (`-arm64.dmg`);
            > "Intel" means an older Mac (`-x64.dmg`).
            > Downloading the wrong one shows the warning
            > "WorshipDesk is not supported on this Mac".

            > **macOS: "app is damaged" or "cannot be opened"?**
            > These builds are not code-signed or notarised, so Gatekeeper blocks
            > them on first open. Open the folder containing the app, right-click
            > (or Control-click) **WorshipDesk.app** → **Open** → **Open** in the
            > dialog. It will then open normally every time.
          draft: false
          prerelease: false
          overwrite: true